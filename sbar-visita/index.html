<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBAR e Visita Multiprofissional — HEMOAM</title>
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 16px;
    color: #1a1a1a;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .sub { font-size: 13px; color: #666; margin-bottom: 16px; }
  .hub-back { background: #1f3864; padding: 6px 16px; font-family: Arial, Helvetica, sans-serif; margin: -16px -16px 16px -16px; }
  .hub-back a { color: #fff; text-decoration: none; font-size: 13px; font-weight: bold; }
  .hub-back a:hover { text-decoration: underline; }

  .opcoes { display: flex; flex-direction: column; gap: 12px; max-width: 640px; }
  .opcao {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
    border: 1px solid #e2e5ea;
    border-radius: 10px;
    padding: 18px 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .opcao:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); transform: translateY(-1px); }
  .opcao img { width: 48px; height: 48px; flex-shrink: 0; border-radius: 11px; }
  .opcao .info { flex: 1; min-width: 0; }
  .opcao .nome { font-weight: 700; color: #1e3a5f; font-size: 16px; }
  .opcao .desc { font-size: 13px; color: #888; margin-top: 3px; }
  .opcao .seta { flex-shrink: 0; color: #9aa6b4; font-size: 20px; }
</style>
</head>
<body>

<div class="hub-back">
  <a href="../">← Painel HEMOAM UTI Pediátrica</a>
</div>

<h1>SBAR e Visita Multiprofissional</h1>
<div class="sub">HEMOAM — escolha a ferramenta</div>

<div class="opcoes">
  <a class="opcao" href="../isbar/">
    <img src="../assets/favicons-externos/sbar.png" alt="">
    <div class="info">
      <div class="nome">SBAR</div>
      <div class="desc">Comunicação estruturada de passagem de plantão</div>
    </div>
    <div class="seta">›</div>
  </a>

  <a class="opcao" href="../visita-multi/">
    <img src="../assets/favicons-externos/visita-multi.png" alt="">
    <div class="info">
      <div class="nome">Visita Multiprofissional</div>
      <div class="desc">Checklist da visita multiprofissional por leito</div>
    </div>
    <div class="seta">›</div>
  </a>
</div>

</body>
</html>
